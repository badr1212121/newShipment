# Test config — used automatically when running tests.
# Uses an in-memory H2 database so tests need no real MySQL (works in CI).
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Fixed secret so the app context can start during tests
jwt.secret=ZGVtbzEyMzQ1Njc4OTBhYmNkZWZnaGlqa2xtbm9wcXJzdHV2d3h5eg==

# Stripe — dummy values for tests (no real Stripe calls happen in unit/context tests)
stripe.secret-key=sk_test_dummy
stripe.webhook-secret=whsec_dummy
app.frontend-url=http://localhost:5173
