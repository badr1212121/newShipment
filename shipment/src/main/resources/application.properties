spring.application.name=shipment

# Server
server.port=${SERVER_PORT:8080}

# MySQL datasource (override via environment variables)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/shipment}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

# JWT (HS256, base64-encoded 256-bit secret; override in production)
jwt.secret=${JWT_SECRET:ZGVtbzEyMzQ1Njc4OTBhYmNkZWZnaGlqa2xtbm9wcXJzdHV2d3h5eg==}
