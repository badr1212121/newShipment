name: CD

# Continuous Deployment: after code lands on main, build the Docker images
# and publish them to the GitHub Container Registry (GHCR). The images are
# then ready to pull and run on any server or cloud.
on:
  push:
    branches: [ main ]

# Allow this workflow to write packages (push images to GHCR).
permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & push Docker images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Log in to GHCR using the token GitHub provides automatically —
      # no extra account or secrets needed.
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Turn the repository owner (badr1212121) into lowercase, because
      # image names in GHCR must be lowercase.
      - name: Set lowercase image prefix
        id: prep
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./shipment
          push: true
          tags: |
            ghcr.io/${{ steps.prep.outputs.owner }}/shipment-backend:latest
            ghcr.io/${{ steps.prep.outputs.owner }}/shipment-backend:${{ github.sha }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/${{ steps.prep.outputs.owner }}/shipment-frontend:latest
            ghcr.io/${{ steps.prep.outputs.owner }}/shipment-frontend:${{ github.sha }}
